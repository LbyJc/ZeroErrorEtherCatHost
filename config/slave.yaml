# 从站标识与驱动器特性
slave:
  alias: 0
  position: 0
  vendor_id: 0x5a65726f          # "Zero"
  product_code: 0x00029252
  name: "ZeroErr eRob80H120I-BHM-18ET[V6]"
  esi_file: "/home/tyy/eRob_EtherCAT/ethercat/ZeroErr+Driver_V3.2.0.xml"

  # 0x6502 Supported Drive Modes = 0x38D
  #   bit0 pp / bit1 vl(无) / bit2 pv / bit3 tq / bit4 (无) / bit5 hm(无)
  #   bit7 csp / bit8 csv / bit9 cst
  supported_modes_raw: 0x38D
  supports_homing: false         # 本驱动器不支持 Homing，GUI 按钮点击时给明确提示

  # 通信周期硬约束。来源：eRob CANopen and EtherCAT 用户手册 4.5.2 节
  #   "基于 TwinCAT3 测试，eRob 支持的最小通信周期时间为 500us，
  #    Master cycle time 应该是该值的倍数（1x500us, 2x500us, 3x500us…）"
  # 实测：cycle_us 设 250 时从站在 PREOP 阶段就拒绝配置，连 SAFEOP 都进不去。
  # 这不是 PC 实时性问题，是驱动器 ESC 的输入延时上限（最高 2 KHz）。
  min_cycle_us: 500

  # 驱动器上电自检相关的已知现象（GUI 用它把"正常噪声"和"真故障"区分开）
  known_conditions:
    - code: 0x730F
      meaning: "负载端编码器多圈保持电池电压低于 3.05V"
      latched: true
      fault_reset_clears: false
      remedy_object: 0x2242      # 向 0x2242 写 1 = Reset load side encoder
      remedy_hint: "未装 3.6V 多圈电池时上电必报。Fault Reset 清不掉，需重置负载端编码器（会清零多圈计数）。"
    - code: 0xA000
      meaning: "EtherCAT 总线通信异常（手册 7.2.27）"
      latched: true
      benign: false
      remedy_hint: >
        直接原因是「使能状态下发生 EtherCAT 通信中断，或通信正常时 EtherCAT 切换到非 OP」。
        ⚠ 曾经把它误判成"可忽略的记录"——那是因为观察到的几次都发生在**已撤使能之后**
        （停止主站时 deactivate），那种情况只写进 0x1003 历史、不置 FAULT 位。
        但在**使能状态下**发生就是真故障，会锁存，必须 Fault Reset。
        实测触发场景：cycle_us=500 且 CPU 未做内核级隔离时，
        实时线程偶发毫秒级抖动 → 帧错过 DC 同步窗口 → 驱动器判定通信异常。
        对策见 ethercat.yaml 里 cycle_us 的注释。

  # 空行占位（下面的 startup_sdo 是与 slave 同级的顶层键）

  # 只在 activate 之前 / deactivate 之后读的诊断 SDO（阻塞式）
  # ⚠ 绝不可在 OP 期间阻塞式读，会导致进程 D 状态死锁、只能重启机器
  diagnostic_sdos:
    - {index: 0x1001, sub: 0, type: u8,  name: "error_register"}
    - {index: 0x1003, sub: 0, type: u8,  name: "error_history_count"}
    - {index: 0x6079, sub: 0, type: u32, name: "dc_link_voltage_mV"}
    - {index: 0x22A2, sub: 0, type: u16, name: "drive_temperature"}
    - {index: 0x6075, sub: 0, type: u32, name: "rated_current_mA"}
    - {index: 0x6076, sub: 0, type: u32, name: "rated_torque_mNm"}

# ── 启动时下发给驱动器的参数 ─────────────────────────────────────────────
# 在 activate 之前用阻塞式 SDO 写（此时相位合法）。
# 目的：让关键阈值由配置文件说了算，不依赖"这台驱动器碰巧被谁手工设过"，
# 也不依赖驱动器 NVM 是否保存住。换一台驱动器直接就是对的。
startup_sdo:
  - index: 0x3B61
    sub: 0
    type: u32
    value: 3500
    name: "软速度跟随误差窗口"
    comment: >
      出厂默认是 0，而窗口为 0 等于任何跟随误差都触发软警告
      （0x3B68 = 0xFF00），实测一开跑就报、且清了又来。
      取硬窗口 0x3B60(=35000 counts/s) 的 10%，约合电机侧 48 rpm 的容限，
      远低于硬保护阈值。2026-08-10 真机验证：设置后跑 100 rpm 全程无警告。
