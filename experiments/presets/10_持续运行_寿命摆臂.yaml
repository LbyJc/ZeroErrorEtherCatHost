# 持续运行（寿命摆臂）——2026-08-14 定稿：恒速连续回转（替代原正弦往复）
# 2026-08-18 默认转速 20 → 25 rpm（用户现场决定）
name: 持续运行_寿命摆臂
kind: continuous
mode: CSV
description: |
  寿命摆臂恒速连续回转：输出侧默认 25 rpm，无限时长，摆臂+配重匀速转。
  转速可在点【开始】后的弹框里修改（负值=反转），会覆盖默认值并如实写进数据标注。
  开始前确认：① 配重锁紧、限位已拆除或不阻挡整圈回转、线缆不会缠绕；
  ② 已 Servo Enable。启动按斜坡加速（约 1.65 rpm/s，到 25 rpm 约 15 s）。
  点【持续运行(线A) 开始】自动录制+运行；到寿命节点时点【结束】停止。
record:
  speed_rpm_target: 25
trajectory:
  type: constant
  value: 25
  duration_s: -1
